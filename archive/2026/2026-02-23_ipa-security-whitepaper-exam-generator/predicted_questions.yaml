-
  exam_type: SC_午前2
  topic: ランサムウェア被害の二重恐喝化
  question_id: PRED-AM2-01
  body: ランサムウェア被害の二重恐喝化に関連して、組織が優先して実施すべき対策として最も適切なものはどれか。
  choices:
    - 被害発生後にのみ対策方針を検討し、平時の準備は行わない。
    - 技術対策・運用対策・教育対策を組み合わせ、継続的に見直す。
    - 単一製品の導入だけで全てのリスクが解消するとみなす。
    - 監査証跡を残さないことで運用負荷を下げる。
  answer: 技術対策・運用対策・教育対策を組み合わせ、継続的に見直す。
  explanation: ランサムウェア被害の二重恐喝化は攻撃手法や環境変化の影響を受けやすく、単発の対策では不十分である。多層防御と運用改善を継続するアプローチがSC試験で重視される。
