-
  exam_type: SC_午後1
  topic: サプライチェーン攻撃の再拡大
  question_id: PRED-PM1-01
  body: 企業Aは「サプライチェーン攻撃の再拡大」への備えを見直している。対象資産は販売管理SaaS連携APIで、主な関係者は情シス部、購買部、委託先開発会社である。制約条件として繁忙期で停止可能時間は深夜2時間があり、既存対策としてSBOM提出を契約条項化済みを運用している。今回、更新モジュール署名鍵の漏えい疑いが観測された。あなたはSC担当として、実行可能性と証拠性を両立した対応方針を示したい。
  choices:
    - "設問1: この事象で最初の30分に行うべき判断と連絡先を、関係者の役割に触れて述べよ。"
    - "設問2: 既存対策（SBOM提出を契約条項化済み）を踏まえ、追加すべき技術的対策を2点示せ。"
    - "設問3: 制約（繁忙期で停止可能時間は深夜2時間）を守りつつ、1か月以内に実施できる再発防止策を1つ示せ。"
  answer: 初動では影響範囲の確定と証拠保全を優先し、権限の一時遮断・通信制御・関係者連絡を同時並行で進める。次に既存統制の穴を補う検知ルール改修と運用手順更新を行い、制約内で段階導入する。
  explanation: 正答の理由は、資産・関係者・制約に合わせて優先順位を具体化しており、実務で要求される実行可能性を満たすため。誤答として「全停止を即断して原因調査を後回しにする」方針は、制約違反や業務影響の過大化を招く。
