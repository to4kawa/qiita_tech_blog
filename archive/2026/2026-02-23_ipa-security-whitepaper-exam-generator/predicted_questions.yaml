-
  exam_type: SC_午前2
  topic: ランサムウェア被害の二重恐喝化
  question_id: PRED-AM2-01
  body: 【定義】ランサムウェア被害の二重恐喝化の対策検討において、最も適切な記述はどれか。
  choices:
    - A. 脅威の有無に関係なく、資産・経路・権限の関係を継続的に検証する考え方。（ランサムウェア被害の二重恐喝化の文脈）
    - B. 年1回の監査時のみ設定値を見直す運用方法。
    - C. 障害時だけ通信を遮断する手順書。
    - D. 機器調達時に価格のみで選定する購買方針。
  answer: A. 脅威の有無に関係なく、資産・経路・権限の関係を継続的に検証する考え方。（ランサムウェア被害の二重恐喝化の文脈）
  explanation: 正答はA。脅威の有無に関係なく、資産・経路・権限の関係を継続的に検証する考え方。は実効性のある統制設計に直結するためである。誤答例として「年1回の監査時のみ設定値を見直す運用方法。」は、統制の継続性や根拠を欠きリスクを増やす。 また、ランサムウェア被害の二重恐喝化では業務制約を無視した画一対応は有効でない。
