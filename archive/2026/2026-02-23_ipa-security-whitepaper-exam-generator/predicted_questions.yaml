  exam_type: SC_午後1
  topic: サプライチェーン攻撃の再拡大
  question_id: PRED-PM1-01
  body: ある企業ではサプライチェーン攻撃の再拡大に関するリスク増大を受け、情報システム部門とCSIRTが共同で改善計画を立案している。現状は、資産台帳の更新遅延、委託先管理のばらつき、ログ保全期間の不足が課題である。この状況を踏まえ、次の設問に答えよ。
  choices:
    - "設問1: 初動で最優先に整備すべき管理策を述べよ。"
    - "設問2: 技術的対策を2つ挙げ、期待効果を述べよ。"
    - "設問3: 運用定着のためのKPI例を1つ示せ。"
  answer: 資産把握と責任分界の明確化を起点に、最小権限化・監視強化・訓練を組み合わせる。
  explanation: サプライチェーン攻撃の再拡大では、個別技術よりも管理策・技術策・運用策の整合が問われる。午後問題では、課題抽出→優先順位→実装→評価指標の流れで記述する構成が得点しやすい。
